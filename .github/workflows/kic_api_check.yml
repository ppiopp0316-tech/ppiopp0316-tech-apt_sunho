name: Knowledge center API connectivity check
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * 1' # Monday 10:15 Asia/Seoul (UTC+9)
permissions:
  contents: read
jobs:
  api-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Check approved BuildingHUB API
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python scripts/probe_kic_api.py
